name: bq-slot
description: >
  Passthrough since FINAL-PLAN S2 (2026-11-17): runs the script directly, holds no slot and waits for nothing.
  Inputs are unchanged so callers keep working. RAM is capped by the pool (adhoc.slice) the runner step
  lives in, not by build-queue's old M/L lock files.
inputs:
  lane:
    description: "m or l — still validated so a typo fails like before; no longer selects a slot"
    required: true
  run:
    description: "bash script to run (gets the caller's env; pass expression values through env, not inline)"
    required: true
  max-wait-min:
    description: "ignored since FINAL-PLAN S2 (there is no slot to wait for); kept so callers that pass it keep working"
    required: false
    default: "15"
runs:
  using: composite
  steps:
    - name: Run (${{ inputs.lane }} · passthrough)
      shell: bash
      env:
        BQ_LANE: ${{ inputs.lane }}
        BQ_RUN: ${{ inputs.run }}
      run: |
        set -euo pipefail
        # FINAL-PLAN S2 (ข้อ 3.1 M2 · 6.3 แถว S2): bq-slot เป็นทางเข้าแบบสมัครใจที่แผนตัดทิ้ง ⇒ ไม่ถือ lock ไม่รอ
        # เพดานแรมของ step นี้คือ pool (adhoc.slice) ที่ runner อยู่ · lock M/L เดิม (agent-build-m-*.lock,
        # agent-build.lock) เป็นของ build-queue รุ่นเก่า · คง input เดิมไว้ให้ workflow ที่เรียกไม่พัง
        case "$BQ_LANE" in
          m | l) ;;
          *) echo "::error::bq-slot lane must be m or l (got '$BQ_LANE')"; exit 2 ;;
        esac
        echo "bq-slot: passthrough (FINAL-PLAN S2) · no slot held · lane ${BQ_LANE} ignored"
        bash -euo pipefail -c "$BQ_RUN"
