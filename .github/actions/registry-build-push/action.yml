name: Registry build and push
description: >
  Build an image and push it to ANY OCI registry that accepts a username and
  password — our self-hosted Zot, GHCR, DOCR, Docker Hub. Emits the full image
  URI plus the SHA tag, matching `ecr-build-push` so a caller switching over
  changes its `with:` block and nothing else.

  WHY THIS EXISTS ALONGSIDE ecr-build-push. That action gets its registry
  password by assuming an AWS role, so every repo that used it — including the
  ones deploying to our own hardware — stopped being able to deploy the moment
  the AWS account was suspended for non-payment (2026-08-31). A registry
  credential should not be reachable only through one vendor's control plane.
  This action takes the credential as an input and therefore has no opinion
  about who runs the registry.

inputs:
  registry:
    description: >
      Registry host, no scheme and no trailing slash — `registry.uplifttech.dev`,
      `ghcr.io`, `sgp1.digitaloceanspaces.com`. Combined with `repo` and the
      short SHA to form the image URI.
    required: true
  repo:
    description: >
      Repository path inside the registry, e.g. `account` or `uplift/account`.
      GHCR requires the owner as the first segment; Zot does not care.
    required: true
  username:
    description: "Registry username. Pass from a secret, never inline."
    required: true
  password:
    description: "Registry password or token. Pass from a secret, never inline."
    required: true

  dockerfile:
    description: "Path to the Dockerfile."
    required: false
    default: "Dockerfile"
  context:
    description: "Build context."
    required: false
    default: "."
  build_args:
    description: "Newline-separated KEY=VALUE build args."
    required: false
    default: ""
  github_token_secret:
    description: >
      When 'true', mounts $GITHUB_TOKEN as a BuildKit secret named
      `github_token`. Required by every Dockerfile that installs
      @uplift-technology-company-limited/* from GitHub Packages. The token is
      mounted, never baked into a layer.
    required: false
    default: "false"
  platform:
    description: >
      Target platform. Leave EMPTY for a native build, which is what you want
      whenever the runner and the destination share an architecture — both
      uplift-server-01 and the DO droplets are x86_64, so the common case is
      native and fast. Set `linux/arm64` only when the destination is Graviton;
      that forces QEMU emulation and a Next.js build gets several times slower.
    required: false
    default: ""
  push_latest:
    description: "Also tag and push the moving tag (see `moving_tag`)."
    required: false
    default: "true"
  moving_tag:
    description: >
      ชื่อ tag ที่ "ขยับ" ซึ่ง compose บนเครื่องปลายทาง pin ไว้ — deploy คือการ
      pull tag นี้ใหม่ ไม่ใช่การแก้ไฟล์ compose

      🔴 tier `prod` ของ uplift-server-01 บังคับให้ pin `:prod` **ไม่ใช่ `:latest`**
      (`/srv/stacks/prod/README.md` ข้อ 2) เพราะ `:latest` ไม่บอกว่ามาจาก branch ไหน
      และถ้าวันหนึ่งมี tier อื่น push เข้า repo เดียวกันก็จะทับกันเงียบ ๆ

      default `latest` ⇒ caller เดิมได้พฤติกรรมเดิมเป๊ะ
    required: false
    default: "latest"

outputs:
  image:
    description: "Full image URI including the SHA tag — pass this to the deploy workflow."
    value: ${{ steps.build.outputs.image }}
  tag:
    description: "The short SHA used as the image tag."
    value: ${{ steps.build.outputs.tag }}

runs:
  using: composite
  steps:
    # Every job on a self-hosted runner shares ONE ~/.docker/config.json, so a
    # `docker logout` at the end of one job deletes the credentials another job
    # is in the middle of pushing with. Measured, not theorised: 2026-09-19
    # samphon backend logged out at 09:45:25Z and samphon frontend — logged in
    # since 09:45:13Z — failed its push at 09:46:03Z with `no basic auth
    # credentials`; sanoe_pos_backend hit the same thing on 2026-09-20 two
    # minutes after a sanoe_pos_web merge. Nothing is wrong with either repo's
    # secrets, which is what makes it so confusing to debug from the failing
    # side.
    #
    # So each job gets its own credential store. Written to $GITHUB_ENV rather
    # than scoped to these steps, deliberately: the caller logs in AGAIN after
    # this action (it has to — see the Log out step below), and that second
    # login has to land in the same isolated store or the race simply moves
    # there. RUNNER_TEMP is wiped by the runner between jobs.
    - name: Isolate this job's docker credentials
      shell: bash
      run: |
        set -euo pipefail
        # RUNNER_TEMP is already per-job: every runner slot has its own
        # _work/_temp and no slot runs two jobs at once, so this path cannot
        # collide with a concurrent job the way ~/.docker/config.json does.
        cfg="${RUNNER_TEMP}/docker-config"
        mkdir -p "$cfg"
        echo "DOCKER_CONFIG=$cfg" >> "$GITHUB_ENV"
        echo "docker credentials for this job live in $cfg"

    # --password-stdin, never --password: an argument is visible in the process
    # table to every other process on a self-hosted runner, which is a machine
    # we share between repos rather than a fresh VM per job.
    - name: Log in to the registry
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        REG_USER: ${{ inputs.username }}
        REG_PASS: ${{ inputs.password }}
      run: |
        set -euo pipefail
        if [ -z "$REG_PASS" ]; then
          echo "::error::Registry password is empty. The caller must pass it from a secret — an unset secret arrives as an empty string, which docker login accepts and then every push 401s."
          exit 1
        fi
        printf '%s' "$REG_PASS" | docker login "$REGISTRY" --username "$REG_USER" --password-stdin

    - name: Build and push
      id: build
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        IMAGE_REPO: ${{ inputs.repo }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        BUILD_CONTEXT: ${{ inputs.context }}
        BUILD_ARGS: ${{ inputs.build_args }}
        USE_GH_SECRET: ${{ inputs.github_token_secret }}
        PLATFORM: ${{ inputs.platform }}
        PUSH_LATEST: ${{ inputs.push_latest }}
        MOVING_TAG: ${{ inputs.moving_tag }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        SHA=$(git rev-parse --short HEAD)
        IMAGE="$REGISTRY/$IMAGE_REPO:$SHA"

        args=(build -f "$DOCKERFILE" -t "$IMAGE")
        # `if` blocks, not `[ ... ] && ...`. Under `set -e` a failed test at the
        # end of an AND-OR list hands the list its non-zero status and the shell
        # exits — so `push_latest: false` used to end the step right here, before
        # the build even started, with nothing printed. The default is "true",
        # which is the only reason this has not bitten anyone yet.
        if [ "$PUSH_LATEST" = "true" ]; then
          args+=(-t "$REGISTRY/$IMAGE_REPO:$MOVING_TAG")
        fi
        if [ -n "$PLATFORM" ]; then
          args+=(--platform "$PLATFORM")
        fi
        if [ "$USE_GH_SECRET" = "true" ]; then
          args+=(--secret id=github_token,env=GITHUB_TOKEN)
        fi
        # RUN ของ image build ลง pool (FINAL-PLAN S2 · M2): uplift-server-01 มี adhoc.slice = pool ก้อนเดียว
        # (MemoryMax 7G · swap 0) ⇒ --cgroup-parent=adhoc.slice ทำให้ BuildKit ฝังใน dockerd วาง RUN ที่
        # /adhoc.slice/buildkit/<id> (วัด 17 พ.ย. · STATUS ข้อสมมติ 2) · ไม่ใส่ flag ⇒ RUN ตกที่
        # /system.slice/adhoc.slice:docker:<id> ไม่มีเพดาน · cibuild.slice เดิมเลิกใช้ (pool แทน 7 เพดาน)
        # ชื่อไม่มี "-" ⇒ systemd กับ BuildKit อ่าน path ตรงกัน (dash = ซ้อนชั้นใน systemd · วัด 12 พ.ย.)
        # flag นี้มีผลกับ builder driver `docker` เท่านั้น (docker-container/kubernetes เมินเงียบ ๆ และ RUN ไปอยู่ใน
        # container ของ builder) ⇒ บน pool host บังคับ BUILDX_BUILDER=default (driver docker) ให้คำสั่ง build นี้
        # action นี้ไม่ใช้ cache exporter หรือ --push ของ buildx อยู่แล้ว builder อื่นจึงไม่ได้อะไรเพิ่ม
        # (driver docker-container ไม่ --load ด้วยซ้ำ ⇒ docker push ข้างล่างจะหา image ไม่เจอ)
        POOL_HOST=""
        if [ -d /sys/fs/cgroup/adhoc.slice ] || [ -d /data/build ]; then POOL_HOST=1; fi
        if [ -n "$POOL_HOST" ]; then
          if [ -d /sys/fs/cgroup/adhoc.slice ]; then
            args+=(--cgroup-parent=adhoc.slice)
            echo "RUN steps go into the pool: adhoc.slice (memory.max $(cat /sys/fs/cgroup/adhoc.slice/memory.max 2>/dev/null || echo '?'))"
          else
            echo "::warning::/data/build exists but /sys/fs/cgroup/adhoc.slice does not — RUN steps are NOT in the pool (adhoc-anchor.service down?)"
          fi
          cur=$(docker buildx inspect 2>/dev/null | awk '/^Name:/{n=$2} /^Driver:/{print n" (driver "$2")"; exit}' || true)
          if [ -n "$cur" ] && [[ "$cur" != *"(driver docker)" ]]; then
            echo "::notice::current buildx builder is ${cur}; building with 'default' (driver docker) instead so --cgroup-parent takes effect"
          fi
          echo "BuildKit builder: $(BUILDX_BUILDER=default docker buildx inspect 2>/dev/null | awk '/^Name:/{n=$2} /^Driver:/{print n" (driver "$2")"; exit}' || echo '?')"
        fi

        while IFS= read -r ba; do
          if [ -n "$ba" ]; then
            args+=(--build-arg "$ba")
          fi
        done <<< "$BUILD_ARGS"

        args+=("$BUILD_CONTEXT")

        # คิว image build ของ uplift-server-01 (FINAL-PLAN S2 · M3 · ข้อ 3.3 แถว 3): semaphore 2 ช่อง
        # /data/build/ci-image-build-{0,1}.lock · repo ใน heavy_repos ของ /srv/stacks/bin/pool.conf (ค่าเริ่ม
        # uplift-figcraft) หรือ env CI_BUILD_HEAVY=1 ⇒ ถือ ci-heavy-0.lock แล้วทั้ง 2 ช่อง · รอได้ตราบที่ผู้ถือยังเดิน
        # (log โต หรือ BuildKit ใน pool ใช้ cpu) · นิ่ง CI_BUILD_STALL_MIN (10) นาที / ผู้ถือตาย / เกิน
        # CI_BUILD_LOCK_WAIT_MIN (ไม่ตั้ง = ไม่จำกัด) ⇒ ::error:: พร้อมชื่อผู้ถือ exit 75 · 🔴 ไม่มีทาง build โดยไม่ถือที่นั่ง
        # ผู้ถือดูได้ที่ /data/build/ci-image-build-N.owner (ci-status) · ตรรกะทั้งหมด + เทสอยู่ใน ci-image-build-slot.sh
        # host อื่น (GitHub-hosted, EC2 arm64) ไม่มี pool และไม่มี /data/build ⇒ build ตรงเหมือนเดิม
        if [ -n "$POOL_HOST" ]; then
          bash "$ACTION_PATH/ci-image-build-slot.sh" -- env DOCKER_BUILDKIT=1 BUILDX_BUILDER=default docker "${args[@]}"
        else
          DOCKER_BUILDKIT=1 docker "${args[@]}"
        fi
        # ที่นั่งปล่อยเมื่อ build จบ (ก่อน push): push ใช้เน็ต ไม่ใช้แรม
        docker push "$IMAGE"
        if [ "$PUSH_LATEST" = "true" ]; then
          docker push "$REGISTRY/$IMAGE_REPO:$MOVING_TAG"
        fi

        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
        echo "tag=$SHA" >> "$GITHUB_OUTPUT"
        echo "Built and pushed $IMAGE"

    # The runner is shared and long-lived: a credential left behind outlives
    # this job and is readable by the next one, which may belong to a different
    # repository. Since the step above moved this job onto its own DOCKER_CONFIG
    # this logout can no longer reach another job's session — which is the whole
    # point — but it still clears ours rather than leaning on RUNNER_TEMP
    # cleanup to do it.
    - name: Log out
      if: always()
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
      run: docker logout "$REGISTRY" || true
