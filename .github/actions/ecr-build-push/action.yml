name: ECR build and push
description: >
  Log in to ECR, compute a deterministic image tag from the git SHA, build the
  image natively (no QEMU — the org runner is arm64/Graviton, matching the ECS
  cluster) and push both the SHA tag and :latest. Emits the full image URI for
  the reusable ecs-deploy workflow to consume.

inputs:
  ecr_repo:
    description: "ECR repository name."
    required: true
  aws_region:
    description: >
      Target region. Composite actions CANNOT read the `vars` context — that is a
      workflow-only capability — so the CALLER must pass vars.AWS_REGION through
      this input explicitly. Falls back to $AWS_REGION / $AWS_DEFAULT_REGION from the job env.
    required: false
    default: ""
  aws_account_id:
    description: >
      Registry account. Leave empty to derive it from `sts get-caller-identity`,
      which is always correct for whatever credentials the runner actually holds
      and cannot drift out of sync with a variable.
    required: false
    default: ""
  dockerfile:
    description: "Path to the Dockerfile."
    required: false
    default: "Dockerfile"
  context:
    description: "Build context."
    required: false
    default: "."
  build_args:
    description: "Newline-separated KEY=VALUE build args."
    required: false
    default: ""
  github_token_secret:
    description: >
      When 'true', mounts $GITHUB_TOKEN as a BuildKit secret named `github_token`.
      Required by every Dockerfile that installs @uplift-technology-company-limited/*
      packages from GitHub Packages. The token is mounted, never baked into a layer.
    required: false
    default: "false"
  platform:
    description: "Target platform. Empty = native (correct on the arm64 runner for the arm64 cluster; setting this forces slow emulation)."
    required: false
    default: ""
  push_latest:
    description: "Also tag and push :latest."
    required: false
    default: "true"

outputs:
  image:
    description: "Full image URI including the SHA tag — pass this to ecs-deploy."
    value: ${{ steps.build.outputs.image }}
  tag:
    description: "The short SHA used as the image tag."
    value: ${{ steps.build.outputs.tag }}

runs:
  using: composite
  steps:
    # Resolved once and exported, because the two steps below both need them and
    # a composite action has no `vars` context of its own to fall back on.
    - name: Resolve registry
      shell: bash
      env:
        IN_REGION: ${{ inputs.aws_region }}
        IN_ACCOUNT: ${{ inputs.aws_account_id }}
      run: |
        set -euo pipefail
        REGION="${IN_REGION:-${AWS_REGION:-${AWS_DEFAULT_REGION:-}}}"
        if [ -z "$REGION" ]; then
          echo "::error::No region resolved. The caller must pass aws_region (from the org variable AWS_REGION) — a composite action has no vars context of its own."
          exit 1
        fi
        ACCOUNT="$IN_ACCOUNT"
        if [ -z "$ACCOUNT" ]; then
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text --region "$REGION")
        fi
        {
          echo "ECR_REGION=$REGION"
          echo "ECR_ACCOUNT=$ACCOUNT"
          echo "ECR_REGISTRY=$ACCOUNT.dkr.ecr.$REGION.amazonaws.com"
        } >> "$GITHUB_ENV"
        echo "Registry: $ACCOUNT.dkr.ecr.$REGION.amazonaws.com"

    - name: Log in to Amazon ECR
      shell: bash
      run: |
        set -euo pipefail
        aws ecr get-login-password --region "$ECR_REGION" \
          | docker login --username AWS --password-stdin "$ECR_REGISTRY"

    - name: Build and push
      id: build
      shell: bash
      env:
        ECR_REPO: ${{ inputs.ecr_repo }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        BUILD_CONTEXT: ${{ inputs.context }}
        BUILD_ARGS: ${{ inputs.build_args }}
        USE_GH_SECRET: ${{ inputs.github_token_secret }}
        PLATFORM: ${{ inputs.platform }}
        PUSH_LATEST: ${{ inputs.push_latest }}
      run: |
        set -euo pipefail
        SHA=$(git rev-parse --short HEAD)
        REG="$ECR_REGISTRY"
        IMAGE="$REG/$ECR_REPO:$SHA"

        args=(build -f "$DOCKERFILE" -t "$IMAGE")
        [ "$PUSH_LATEST" = "true" ] && args+=(-t "$REG/$ECR_REPO:latest")
        [ -n "$PLATFORM" ] && args+=(--platform "$PLATFORM")
        [ "$USE_GH_SECRET" = "true" ] && args+=(--secret id=github_token,env=GITHUB_TOKEN)

        while IFS= read -r ba; do
          [ -n "$ba" ] && args+=(--build-arg "$ba")
        done <<< "$BUILD_ARGS"

        args+=("$BUILD_CONTEXT")

        DOCKER_BUILDKIT=1 docker "${args[@]}"
        docker push "$IMAGE"
        [ "$PUSH_LATEST" = "true" ] && docker push "$REG/$ECR_REPO:latest"

        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
        echo "tag=$SHA" >> "$GITHUB_OUTPUT"
        echo "Built and pushed $IMAGE"
