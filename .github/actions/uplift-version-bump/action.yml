name: Uplift version bump
description: >
  Compute the next vX.Y.Z from the repository's git tags. The tag is the source
  of truth for what shipped — package.json drifts because people forget to bump
  it, whereas a tag created by the deploy itself cannot lie. Auto-bumps patch on
  every deploy (a de-facto build counter); minor/major are for meaningful
  releases. This only COMPUTES the number: the tag is pushed at the end of a
  green rollout, so a failed deploy leaves no orphan tag and the counter does not
  burn. Encodes the upliftcontrolversion convention in one place instead of ~20
  hand-copied lines per repo.

  Each part is capped at 99 (decided by Anon 2026-09-18): 0.0.99 -> 0.1.0 and
  0.99.x -> 1.0.0. A repo already past the cap (e.g. v0.0.104) rolls over on its
  next bump. A big feature jumps straight to the next minor/major when
  `[minor]` or `[major]` appears in the PR title — i.e. in any commit message
  since the last tag — so no one has to remember to press a button.

inputs:
  bump:
    description: >
      patch | minor | major. Anything else (including empty) is treated as patch.
      A `[minor]`/`[major]` marker in a commit message since the last tag raises
      it; the larger of the two wins.
    required: false
    default: patch
  prefix:
    description: "Tag prefix. `v` gives v1.2.3."
    required: false
    default: "v"

outputs:
  tag:
    description: "Full tag, e.g. v1.2.3 — push this after a successful rollout."
    value: ${{ steps.bump.outputs.tag }}
  version:
    description: "Bare version, e.g. 1.2.3 — feeds APP_VERSION and OTEL_SERVICE_VERSION."
    value: ${{ steps.bump.outputs.version }}
  previous:
    description: "The tag this was bumped from."
    value: ${{ steps.bump.outputs.previous }}

runs:
  using: composite
  steps:
    - name: Compute release version
      id: bump
      shell: bash
      env:
        BUMP: ${{ inputs.bump }}
        PREFIX: ${{ inputs.prefix }}
      run: |
        set -euo pipefail

        # Needs the full history and tags. actions/checkout defaults to a shallow
        # clone with no tags, which silently yields v0.0.1 forever.
        git fetch --tags --quiet origin || true
        if [ -z "$(git tag --list "${PREFIX}*")" ] && [ "$(git rev-list --count HEAD 2>/dev/null || echo 0)" -le 1 ]; then
          echo "::warning::No tags and a shallow history — did the caller set fetch-depth: 0? Versions will restart from ${PREFIX}0.0.1."
        fi

        # sort -V gives the global highest semver. `git describe --abbrev=0` is
        # topology-NEAREST and can pick a lower base on a merge-heavy history,
        # producing a version that goes backwards.
        LATEST=$(git tag --list "${PREFIX}*" | sort -V | tail -n1)
        LATEST=${LATEST:-${PREFIX}0.0.0}
        PREV="$LATEST"

        # Strip SemVer build metadata before parsing. A repo may tag
        # `v1.2.3+45` to carry a build number (an Android versionCode, say) in
        # the tag, and splitting THAT on dots leaves PAT="3+45" — which bash
        # then happily evaluates, so `$((PAT + 1))` is 49 and the version
        # silently jumps. Everything after the first `+` is metadata by the
        # SemVer spec and takes no part in ordering, so dropping it here is
        # correct for those repos and a no-op for every repo tagging vX.Y.Z.
        CORE=${LATEST%%+*}

        IFS='.' read -r MAJ MIN PAT <<< "${CORE#$PREFIX}"
        MAJ=${MAJ:-0}; MIN=${MIN:-0}; PAT=${PAT:-0}

        # A marker in the PR title lands in the merge/squash commit message.
        # Scan everything since the last tag so it is not lost when several PRs
        # ship in one deploy.
        if git rev-parse -q --verify "refs/tags/$LATEST" >/dev/null 2>&1; then
          RANGE="$LATEST..HEAD"
        else
          RANGE="HEAD"
        fi
        MESSAGES=$(git log --format='%s%n%b' "$RANGE" 2>/dev/null || true)
        MARKER=""
        if grep -qiF '[major]' <<< "$MESSAGES"; then MARKER=major
        elif grep -qiF '[minor]' <<< "$MESSAGES"; then MARKER=minor
        fi

        rank() { case "$1" in major) echo 2 ;; minor) echo 1 ;; *) echo 0 ;; esac; }
        LEVEL="${BUMP:-patch}"
        if [ -n "$MARKER" ] && [ "$(rank "$MARKER")" -gt "$(rank "$LEVEL")" ]; then
          echo "Found [$MARKER] in a commit message since $LATEST — bumping $MARKER."
          LEVEL="$MARKER"
        fi

        case "$LEVEL" in
          major) MAJ=$((MAJ + 1)); MIN=0; PAT=0 ;;
          minor) MIN=$((MIN + 1)); PAT=0 ;;
          *)     PAT=$((PAT + 1)) ;;
        esac

        # Cap every part at 99: carry into the part on the left.
        carry() {
          if [ "$PAT" -gt 99 ]; then MIN=$((MIN + 1)); PAT=0; fi
          if [ "$MIN" -gt 99 ]; then MAJ=$((MAJ + 1)); MIN=0; PAT=0; fi
        }
        carry

        TAG="${PREFIX}${MAJ}.${MIN}.${PAT}"
        # A tag can already exist when a previous deploy pushed it but the run
        # was re-triggered, or when someone tagged by hand. Walk forward rather
        # than failing the deploy.
        #
        # `$TAG+*` is checked as well: a repo that carries a build number in the
        # tag has `v1.2.3+45` on the commit, and looking only for the bare
        # `v1.2.3` would call that number free and hand it out twice.
        taken() { [ -n "$(git tag --list "$TAG" "$TAG+*")" ]; }
        while taken; do
          PAT=$((PAT + 1))
          carry
          TAG="${PREFIX}${MAJ}.${MIN}.${PAT}"
        done

        {
          echo "tag=$TAG"
          echo "version=${TAG#$PREFIX}"
          echo "previous=$PREV"
        } >> "$GITHUB_OUTPUT"
        echo "$PREV → $TAG (bump=${BUMP:-patch}, applied=$LEVEL)"
